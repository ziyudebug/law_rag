<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识库检索配置</title>
  <style>
    :root {
      --bg: #f5f7f6;
      --panel: #ffffff;
      --text: #141817;
      --muted: #62706c;
      --line: #dfe5e1;
      --accent: #23675d;
      --accent-dark: #174a42;
      --danger: #b85628;
      --shadow: 0 18px 48px rgba(16, 29, 25, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
    }

    .shell {
      width: min(1040px, calc(100% - 32px));
      margin: 28px auto 44px;
      display: grid;
      gap: 16px;
    }

    .bar,
    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 20px;
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: 24px;
    }

    h2 {
      font-size: 18px;
    }

    a {
      color: var(--accent);
      font-weight: 800;
      text-decoration: none;
    }

    .links {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .panel {
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    input,
    select {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      color: var(--text);
      background: #fbfcfb;
      font: inherit;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(35, 103, 93, 0.12);
    }

    .check {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfb;
    }

    .check input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .mode-panel {
      display: none;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfb;
    }

    .mode-panel.active {
      display: grid;
      gap: 12px;
    }

    button {
      height: 42px;
      border: 0;
      border-radius: 6px;
      padding: 0 16px;
      color: #fff;
      background: var(--accent);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    button.secondary {
      color: var(--accent);
      border: 1px solid var(--line);
      background: #fff;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button.secondary:hover {
      color: var(--accent-dark);
      background: #f8fbfa;
    }

    .status {
      min-height: 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .status.error {
      color: var(--danger);
    }

    @media (max-width: 820px) {
      .bar {
        align-items: flex-start;
        flex-direction: column;
      }

      .grid,
      .grid.two {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="bar">
      <h1>知识库检索配置</h1>
      <div class="links">
        <a href="/retrieval-test">召回测试</a>
        <a href="/upload-test">上传测试</a>
        <a href="/folder-test">文件树测试</a>
        <a href="/">返回文档解析</a>
      </div>
    </header>

    <section class="panel">
      <div class="grid">
        <div class="field">
          <label for="tenant_id">租户 ID</label>
          <input id="tenant_id" type="number" min="1" value="1">
        </div>
        <div class="field">
          <label for="kb_id">知识库 ID</label>
          <input id="kb_id" type="number" min="1" value="1">
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="secondary" id="load-btn" type="button">读取配置</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>当前检索方式</h2>
      <div class="grid">
        <div class="field">
          <label for="retrieval_mode">检索方式</label>
          <select id="retrieval_mode">
            <option value="VECTOR" {% if retrieval_defaults.retrieval_mode == "VECTOR" %}selected{% endif %}>向量检索</option>
            <option value="FULLTEXT" {% if retrieval_defaults.retrieval_mode == "FULLTEXT" %}selected{% endif %}>全文检索</option>
            <option value="HYBRID" {% if retrieval_defaults.retrieval_mode == "HYBRID" %}selected{% endif %}>混合检索</option>
          </select>
        </div>
        <div class="field">
          <label for="top_k">Top K</label>
          <input id="top_k" type="number" min="1" value="{{ retrieval_defaults.top_k }}">
        </div>
        <div class="field">
          <label for="score_threshold">Score 阈值</label>
          <input id="score_threshold" type="number" min="0" step="any" inputmode="decimal" value="{{ retrieval_defaults.score_threshold }}">
        </div>
      </div>
      <div class="check">
        <label for="enable_source">启用 source</label>
        <input id="enable_source" type="checkbox" {% if retrieval_defaults.enable_source %}checked{% endif %}>
      </div>
    </section>

    <section class="mode-panel" data-mode="VECTOR">
      <h2>向量检索</h2>
      <div class="grid two">
        <div class="check">
          <label for="use_rerank_vector">使用 rerank 模型</label>
          <input id="use_rerank_vector" type="checkbox" {% if retrieval_defaults.use_rerank %}checked{% endif %}>
        </div>
        <div class="field">
          <label for="rerank_model_vector">rerank 模型</label>
          <input id="rerank_model_vector" value="{{ default_rerank_model }}">
        </div>
      </div>
    </section>

    <section class="mode-panel" data-mode="FULLTEXT">
      <h2>全文检索</h2>
      <div class="grid two">
        <div class="check">
          <label for="use_rerank_fulltext">使用 rerank 模型</label>
          <input id="use_rerank_fulltext" type="checkbox" {% if retrieval_defaults.use_rerank %}checked{% endif %}>
        </div>
        <div class="field">
          <label for="rerank_model_fulltext">rerank 模型</label>
          <input id="rerank_model_fulltext" value="{{ default_rerank_model }}">
        </div>
      </div>
    </section>

    <section class="mode-panel" data-mode="HYBRID">
      <h2>混合检索</h2>
      <div class="grid">
        <div class="field">
          <label for="hybrid_strategy">排序方式</label>
          <select id="hybrid_strategy">
            <option value="RERANK" {% if retrieval_defaults.hybrid_strategy == "RERANK" %}selected{% endif %}>rerank 模型</option>
            <option value="WEIGHT" {% if retrieval_defaults.hybrid_strategy == "WEIGHT" %}selected{% endif %}>权重设置</option>
          </select>
        </div>
        <div class="field hybrid-rerank-field">
          <label for="rerank_model_hybrid">rerank 模型</label>
          <input id="rerank_model_hybrid" value="{{ default_rerank_model }}">
        </div>
        <div class="field hybrid-weight-field">
          <label for="semantic_weight">语义权重</label>
          <input id="semantic_weight" type="number" min="0" step="0.01" value="{{ retrieval_defaults.semantic_weight }}">
        </div>
        <div class="field hybrid-weight-field">
          <label for="keyword_weight">关键词权重</label>
          <input id="keyword_weight" type="number" min="0" step="0.01" value="{{ retrieval_defaults.keyword_weight }}">
        </div>
      </div>
    </section>

    <section class="bar">
      <button id="save-btn" type="button">保存配置</button>
      <div class="status" id="status"></div>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const modeEl = document.getElementById("retrieval_mode");
    const hybridStrategyEl = document.getElementById("hybrid_strategy");
    const retrievalDefaults = {{ retrieval_defaults|tojson }};
    const defaultRerankModel = {{ default_rerank_model|tojson }};

    function field(id) {
      return document.getElementById(id);
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
    }

    function readNumber(id) {
      return Number(field(id).value);
    }

    function activeRerankModel() {
      if (modeEl.value === "VECTOR") return field("rerank_model_vector").value.trim();
      if (modeEl.value === "FULLTEXT") return field("rerank_model_fulltext").value.trim();
      return field("rerank_model_hybrid").value.trim();
    }

    function activeUseRerank() {
      if (modeEl.value === "VECTOR") return field("use_rerank_vector").checked;
      if (modeEl.value === "FULLTEXT") return field("use_rerank_fulltext").checked;
      return hybridStrategyEl.value === "RERANK";
    }

    function collectPayload() {
      return {
        tenant_id: field("tenant_id").value.trim(),
        kb_id: field("kb_id").value.trim(),
        retrieval_mode: modeEl.value,
        use_rerank: activeUseRerank(),
        rerank_model: activeRerankModel(),
        hybrid_strategy: hybridStrategyEl.value,
        semantic_weight: readNumber("semantic_weight"),
        keyword_weight: readNumber("keyword_weight"),
        top_k: readNumber("top_k"),
        enable_source: field("enable_source").checked,
        score_threshold: readNumber("score_threshold")
      };
    }

    function fillForm(config) {
      field("tenant_id").value = config.tenant_id;
      field("kb_id").value = config.kb_id;
      modeEl.value = config.retrieval_mode || retrievalDefaults.retrieval_mode;
      field("top_k").value = config.top_k ?? retrievalDefaults.top_k;
      field("enable_source").checked = config.enable_source ?? retrievalDefaults.enable_source;
      field("score_threshold").value = config.score_threshold ?? retrievalDefaults.score_threshold;
      hybridStrategyEl.value = config.hybrid_strategy || retrievalDefaults.hybrid_strategy;
      field("semantic_weight").value = config.semantic_weight ?? retrievalDefaults.semantic_weight;
      field("keyword_weight").value = config.keyword_weight ?? retrievalDefaults.keyword_weight;

      const useRerank = config.use_rerank ?? retrievalDefaults.use_rerank;
      field("use_rerank_vector").checked = Boolean(useRerank);
      field("use_rerank_fulltext").checked = Boolean(useRerank);
      field("rerank_model_vector").value = config.rerank_model || defaultRerankModel;
      field("rerank_model_fulltext").value = config.rerank_model || defaultRerankModel;
      field("rerank_model_hybrid").value = config.rerank_model || defaultRerankModel;
      refreshVisibility();
    }

    function refreshVisibility() {
      document.querySelectorAll(".mode-panel").forEach((panel) => {
        panel.classList.toggle("active", panel.dataset.mode === modeEl.value);
      });
      const useWeight = hybridStrategyEl.value === "WEIGHT";
      document.querySelectorAll(".hybrid-weight-field").forEach((item) => {
        item.style.display = useWeight ? "grid" : "none";
      });
      document.querySelectorAll(".hybrid-rerank-field").forEach((item) => {
        item.style.display = useWeight ? "none" : "grid";
      });
    }

    async function loadConfig() {
      setStatus("读取中...");
      const tenantId = encodeURIComponent(field("tenant_id").value.trim());
      const kbId = encodeURIComponent(field("kb_id").value.trim());
      const response = await fetch(`/api/retrieval-config?tenant_id=${tenantId}&kb_id=${kbId}`);
      const payload = await response.json();
      if (!response.ok || !payload.success) throw new Error(payload.error || "读取失败");
      fillForm(payload.data);
      setStatus("配置已读取");
    }

    async function saveConfig() {
      setStatus("保存中...");
      const response = await fetch("/api/retrieval-config", {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(collectPayload())
      });
      const payload = await response.json();
      if (!response.ok || !payload.success) throw new Error(payload.error || "保存失败");
      fillForm(payload.data);
      setStatus("配置已保存");
    }

    modeEl.addEventListener("change", refreshVisibility);
    hybridStrategyEl.addEventListener("change", refreshVisibility);
    document.getElementById("load-btn").addEventListener("click", () => {
      loadConfig().catch((error) => setStatus(error.message, true));
    });
    document.getElementById("save-btn").addEventListener("click", () => {
      saveConfig().catch((error) => setStatus(error.message, true));
    });

    refreshVisibility();
    loadConfig().catch(() => setStatus("填写租户和知识库后读取配置"));
  </script>
</body>
</html>
